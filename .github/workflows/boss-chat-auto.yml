name: Boss Chat Auto

on:
  workflow_dispatch:
    inputs:
      auto_reply:
        description: "是否自动回复简单消息 (true=自动回, false=全部生成草案)"
        type: boolean
        default: true
  schedule:
    # 每 30 分钟自动处理一次 HR 消息 (UTC 时间)
    - cron: "*/30 * * * *"

permissions:
  issues: write
  contents: read

jobs:
  chat:
    runs-on: [self-hosted, macos, local]
    timeout-minutes: 15
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - name: Ensure Chrome
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          PROFILE="$HOME/boss-chrome-profile"
          if ! curl -s --connect-timeout 3 "http://127.0.0.1:9222/json/version" > /dev/null 2>&1; then
            mkdir -p "$PROFILE"
            nohup "$CHROME" --remote-debugging-port=9222 --user-data-dir="$PROFILE" \
              --no-first-run --no-default-browser-check about:blank \
              > /tmp/boss-chrome.log 2>&1 &
            for i in $(seq 1 15); do
              curl -s --connect-timeout 2 "http://127.0.0.1:9222/json/version" > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          echo "Chrome ready"

      - name: Run chat auto
        id: chat
        env:
          AUTO_REPLY: ${{ inputs.auto_reply }}
        run: |
          cd "$HOME/job-agent"
          VENV_PY=loop_agent_v3/.venv/bin/python
          echo "=== 自动处理 HR 消息 ==="
          timeout 600 $VENV_PY loop_agent_v3/cli.py auto > /tmp/chat_auto_result.json 2>/tmp/chat_err.log || true
          cat /tmp/chat_auto_result.json 2>/dev/null || echo "(无结果)"
          echo ""
          cat /tmp/chat_err.log | head -5 || true

      - name: Notify user of pending approvals
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, subprocess, os
          try:
              data = json.load(open('/tmp/chat_auto_result.json'))
          except Exception:
              print("无结果, 跳过")
              exit(0)

          details = data.get('details', [])
          asks = [d for d in details if d.get('action') in ('ask_confirm', 'draft')]
          if not asks:
              print("无待确认项")
              exit(0)

          lines = ["## HR 消息处理结果", "", "以下 HR 消息需要你确认:", ""]
          for d in asks:
              lines.append(f"- **{d.get('company','')}** ({d.get('action','')}): {d.get('reason','')}")
              lines.append(f"  - HR消息: {d.get('reason','')[:60]}")
              lines.append("")
          lines.append("### 处理方式")
          lines.append("1. 运行 **Boss Chat Approval** workflow, action=send 发送已批准的回复")
          lines.append("2. 或运行 **Boss Apply** 继续投递")

          body = "\n".join(lines)
          r = subprocess.run(
              ["/Users/xx/bin/gh", "issue", "create", "--repo", "jennifer95929-svgs/jobHuntingAgent",
               "--title", f"[HR消息] {len(asks)} 条待处理", "--body", body],
              capture_output=True, text=True
          )
          print("issue:", r.stdout.strip() if r.stdout else r.stderr.strip())
          EOF
