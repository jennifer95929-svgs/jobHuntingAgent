name: Boss Apply

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "搜索关键词（如: AI产品经理）"
        type: string
        default: "AI产品经理"
      city:
        description: "城市（如: 深圳）"
        type: string
        default: "深圳"
      max_apply:
        description: "本轮最多投递数"
        type: number
        default: 5

jobs:
  apply:
    runs-on: [self-hosted, macos, local]
    timeout-minutes: 30
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Use local project code
        run: |
          echo "PROJECT_DIR=$HOME/job-agent" >> "$GITHUB_ENV"
          ls "$HOME/job-agent/loop_agent_v3/cli.py" && echo "local code OK" || echo "local code missing"

      - name: Ensure Chrome with debug port
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          PROFILE="$HOME/boss-chrome-profile"
          if ! curl -s --connect-timeout 3 "http://127.0.0.1:9222/json/version" > /dev/null 2>&1; then
            mkdir -p "$PROFILE"
            nohup "$CHROME" --remote-debugging-port=9222 --user-data-dir="$PROFILE" \
              --no-first-run --no-default-browser-check about:blank \
              > /tmp/boss-chrome.log 2>&1 &
            for i in $(seq 1 15); do
              curl -s --connect-timeout 2 "http://127.0.0.1:9222/json/version" > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          echo "Chrome debug port ready"

      - name: Verify BOSS login state
        run: |
          python3 -c "
          import json, urllib.request
          tabs = json.loads(urllib.request.urlopen('http://127.0.0.1:9222/json', timeout=5).read())
          url = [t for t in tabs if t.get('type')=='page'][0].get('url','')
          print('current tab:', url[:80])
          print('NEED_LOGIN' if 'login' in url.lower() else 'LOGIN_STATE_OK')
          "

      - name: Run job search
        id: search
        env:
          KEYWORD: ${{ inputs.keyword }}
          CITY: ${{ inputs.city }}
        run: |
          cd "$PROJECT_DIR"
          VENV_PY=loop_agent_v3/.venv/bin/python
          if [ ! -x "$VENV_PY" ]; then
            python3 -m venv loop_agent_v3/.venv
            loop_agent_v3/.venv/bin/pip install --quiet --only-binary=:all: -i https://pypi.tuna.tsinghua.edu.cn/simple mcp openai python-dotenv websockets
          fi
          echo "=== 搜索: $KEYWORD / $CITY ==="
          $VENV_PY loop_agent_v3/cli.py search "$KEYWORD" "$CITY" > /tmp/search_result.json 2>/tmp/search_err.log || true
          cat /tmp/search_result.json
          echo ""
          echo "=== 提取职位列表 ==="
          sleep 3
          $VENV_PY loop_agent_v3/cli.py scan > /tmp/scan_result.json 2>/tmp/scan_err.log || true
          python3 -c "
          import json
          try:
              data = json.load(open('/tmp/scan_result.json'))
              jobs = data.get('jobs', []) if isinstance(data, dict) else data
              print(f'找到 {len(jobs)} 个职位:')
              for j in jobs[:8]:
                  print(f\"  - {j.get('title','?')} | {j.get('company','?')} | {j.get('salary','?')} | id={j.get('id','?')}\")
          except Exception as e:
              print('解析失败:', e)
          "
          cat /tmp/scan_err.log | head -5 || true

      - name: Upload search result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-result
          path: |
            /tmp/search_result.json
            /tmp/scan_result.json
          if-no-files-found: ignore
