name: Boss Apply

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "搜索关键词（如: AI产品经理）"
        type: string
        default: "AI产品经理"
      city:
        description: "城市（如: 深圳）"
        type: string
        default: "深圳"
      max_apply:
        description: "本轮最多投递数"
        type: number
        default: 50
  # 每天自动投递 (北京时间 09:00 = UTC 01:00)
  # schedule:
#    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, macos, local]
    timeout-minutes: 120
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Use local project code
        run: |
          echo "PROJECT_DIR=$HOME/job-agent" >> "$GITHUB_ENV"
          ls "$HOME/job-agent/loop_agent_v3/cli.py" && echo "local code OK" || echo "local code missing"

      - name: Ensure Chrome with debug port
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          PROFILE="$HOME/boss-chrome-profile"
          if ! curl -s --connect-timeout 3 "http://127.0.0.1:9222/json/version" > /dev/null 2>&1; then
            mkdir -p "$PROFILE"
            nohup "$CHROME" --remote-debugging-port=9222 --user-data-dir="$PROFILE" \
              --no-first-run --no-default-browser-check about:blank \
              > /tmp/boss-chrome.log 2>&1 &
            for i in $(seq 1 15); do
              curl -s --connect-timeout 2 "http://127.0.0.1:9222/json/version" > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          echo "Chrome debug port ready"

      - name: Verify BOSS login state
        run: |
          python3 -c "
          import json, urllib.request
          tabs = json.loads(urllib.request.urlopen('http://127.0.0.1:9222/json', timeout=5).read())
          url = [t for t in tabs if t.get('type')=='page'][0].get('url','')
          print('current tab:', url[:80])
          print('NEED_LOGIN' if 'login' in url.lower() else 'LOGIN_STATE_OK')
          "

      - name: Run job search
        id: search
        env:
          KEYWORDS: ${{ inputs.keyword }}
          CITY: ${{ inputs.city }}
        run: |
          cd "$PROJECT_DIR"
          VENV_PY=loop_agent_v3/.venv/bin/python
          if [ ! -x "$VENV_PY" ]; then
            python3 -m venv loop_agent_v3/.venv
            loop_agent_v3/.venv/bin/pip install --quiet --only-binary=:all: -i https://pypi.tuna.tsinghua.edu.cn/simple mcp openai python-dotenv websockets
          fi
          # 支持逗号分隔的多关键词
          IFS=',' read -ra KW_LIST <<< "$KEYWORDS"
          > /tmp/job_ids.json
          for KW in "${KW_LIST[@]}"; do
            KW=$(echo "$KW" | xargs)  # 去空格
            echo "=== 搜索: $KW / $CITY ==="
            $VENV_PY loop_agent_v3/cli.py search "$KW" "$CITY" > /tmp/search_result.json 2>/tmp/search_err.log || true
            cat /tmp/search_result.json
            echo ""
            echo "=== 提取职位列表 ==="
            sleep 3
            $VENV_PY loop_agent_v3/cli.py scan > /tmp/scan_result.json 2>/tmp/scan_err.log || true
            python3 -c "
import json, os
data = json.load(open('/tmp/scan_result.json'))
jobs = data.get('jobs', []) if isinstance(data, dict) else data
print(f'找到 {len(jobs)} 个职位:')
for j in jobs:
    print(f\"  - {j.get('title','?')} | {j.get('company','?')} | {j.get('salary','?')} | id={j.get('id','?')}\")
ids = json.load(open('/tmp/job_ids.json')) if os.path.exists('/tmp/job_ids.json') else []
existing = set(j.get('id') for j in ids)
for j in jobs:
    jid = j.get('id','')
    if jid and jid not in existing:
        ids.append({'id': jid, 'title': j.get('title',''), 'company': j.get('company',''), 'salary': j.get('salary','')})
        existing.add(jid)
with open('/tmp/job_ids.json','w') as f:
    json.dump(ids, f, ensure_ascii=False)
"
            cat /tmp/scan_err.log | head -3 || true
            sleep 2
          done
          echo ""
          echo "=== 汇总 ==="
          python3 -c "
import json
jobs = json.load(open('/tmp/job_ids.json'))
print(f'累计收集 {len(jobs)} 个职位:')
for j in jobs[:15]:
    print(f\"  - {j.get('title','?')} | {j.get('company','?')} | {j.get('salary','?')} | id={j.get('id','?')}\")
" 2>/dev/null || echo "无职位"

      - name: Apply to jobs
        id: apply-jobs
        env:
          MAX_APPLY: ${{ inputs.max_apply }}
        run: |
          cd "$PROJECT_DIR"
          VENV_PY=loop_agent_v3/.venv/bin/python
          if [ ! -f /tmp/job_ids.json ]; then
            echo "没有职位 ID 文件, 跳过投递"
            exit 0
          fi
          echo "=== 开始投递 (最多 $MAX_APPLY 个) ==="
          python3 -c "
          import json, subprocess, sys
          jobs = json.load(open('/tmp/job_ids.json'))
          max_apply = int('$MAX_APPLY')
          results = []
          for j in jobs[:max_apply]:
              jid = j.get('id','')
              if not jid:
                  continue
              title = j.get('title','')
              company = j.get('company','')
              print(f\"投递: {title} ({company}) id={jid}\", flush=True)
              r = subprocess.run(
                  [sys.executable, 'loop_agent_v3/cli.py', 'apply', jid, title, company],
                  capture_output=True, text=True, timeout=60
              )
              out = r.stdout.strip()
              print(f\"  结果: {out}\", flush=True)
              try:
                  parsed = json.loads(out)
                  results.append({'job_id': jid, 'title': title, 'applied': parsed.get('applied'), 'reason': parsed.get('reason','')})
              except Exception:
                  results.append({'job_id': jid, 'title': title, 'applied': False, 'reason': out[:100]})
          with open('/tmp/apply_results.json','w') as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          applied = sum(1 for r in results if r.get('applied'))
          skipped = len(results) - applied
          print(f'=== 投递完成: 成功 {applied}, 跳过/失败 {skipped} ===')
          " 2>&1
          echo ""
          echo "=== 投递明细 ==="
          cat /tmp/apply_results.json 2>/dev/null || echo "(无结果)"

      - name: Upload apply results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-results
          path: |
            /tmp/search_result.json
            /tmp/scan_result.json
            /tmp/apply_results.json
          if-no-files-found: ignore
