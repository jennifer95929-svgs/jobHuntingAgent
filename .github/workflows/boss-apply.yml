name: Boss Apply

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "搜索关键词, 逗号分隔(穷尽组合)"
        type: string
        default: "AI产品经理,AI产品,产品经理(AI方向),人工智能产品经理,AI应用产品经理,AI产品负责人,AI产品专家,智能产品经理,AIGC产品经理,AI Agent产品经理,大模型产品经理"
      city:
        description: "城市（如: 深圳）"
        type: string
        default: "深圳"
      max_apply:
        description: "本轮最多投递数"
        type: number
        default: 50
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, macos, local]
    timeout-minutes: 120
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Use local project code
        run: |
          echo "PROJECT_DIR=$HOME/job-agent" >> "$GITHUB_ENV"
          ls "$HOME/job-agent/loop_agent_v3/cli.py" && echo "local code OK" || echo "local code missing"

      - name: Ensure Chrome with debug port
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          PROFILE="$HOME/boss-chrome-profile"
          if ! curl -s --connect-timeout 3 "http://127.0.0.1:9222/json/version" > /dev/null 2>&1; then
            mkdir -p "$PROFILE"
            nohup "$CHROME" --remote-debugging-port=9222 --user-data-dir="$PROFILE" \
              --no-first-run --no-default-browser-check about:blank \
              > /tmp/boss-chrome.log 2>&1 &
            for i in $(seq 1 15); do
              curl -s --connect-timeout 2 "http://127.0.0.1:9222/json/version" > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          echo "Chrome debug port ready"

      - name: Verify BOSS login state
        run: |
          python3 -c "import json,urllib.request as u; tabs=json.loads(u.urlopen('http://127.0.0.1:9222/json',timeout=5).read()); url=[t for t in tabs if t.get('type')=='page'][0].get('url',''); print('current tab:',url[:80]); print('NEED_LOGIN' if 'login' in url.lower() else 'LOGIN_STATE_OK')"

      - name: Run job search
        id: search
        env:
          KEYWORDS: ${{ inputs.keyword }}
          CITY: ${{ inputs.city }}
        run: |
          cd "$PROJECT_DIR"
          VENV_PY=loop_agent_v3/.venv/bin/python
          if [ ! -x "$VENV_PY" ]; then
            python3 -m venv loop_agent_v3/.venv
            loop_agent_v3/.venv/bin/pip install --quiet --only-binary=:all: -i https://pypi.tuna.tsinghua.edu.cn/simple mcp openai python-dotenv websockets
          fi
          # 支持逗号分隔的多关键词
          IFS=',' read -ra KW_LIST <<< "$KEYWORDS"
          > /tmp/job_ids.json
          for KW in "${KW_LIST[@]}"; do
            KW=$(echo "$KW" | xargs)  # 去空格
            echo "=== 搜索: $KW / $CITY ==="
            $VENV_PY loop_agent_v3/cli.py search "$KW" "$CITY" > /tmp/search_result.json 2>/tmp/search_err.log || true
            cat /tmp/search_result.json
            echo ""
            echo "=== 提取职位列表 ==="
            sleep 3
            $VENV_PY loop_agent_v3/cli.py scan > /tmp/scan_result.json 2>/tmp/scan_err.log || true
            python3 "$PROJECT_DIR/scripts/merge_jobs.py" /tmp/scan_result.json /tmp/job_ids.json
            cat /tmp/scan_err.log | head -3 || true
            cat /tmp/scan_err.log | head -3 || true
            sleep 2
          done
          echo ""
          echo "=== 汇总 ==="
          python3 "$PROJECT_DIR/scripts/merge_jobs.py" /tmp/job_ids.json /tmp/job_ids.json --summary 2>/dev/null || echo "无职位"

      - name: Apply to jobs
        id: apply-jobs
        env:
          MAX_APPLY: ${{ inputs.max_apply }}
        run: |
          cd "$PROJECT_DIR"
          VENV_PY=loop_agent_v3/.venv/bin/python
          if [ ! -f /tmp/job_ids.json ]; then
            echo "没有职位 ID 文件, 跳过投递"
            exit 0
          fi
          echo "=== 开始投递 (最多 $MAX_APPLY 个) ==="
          # 逐个投递: 单个失败不中断整体 (set +e)
          set +e
          python3 "$PROJECT_DIR/scripts/apply_jobs.py" "$MAX_APPLY" 2>&1
          APPLY_EXIT=$?
          set -e
          echo "apply exit code: $APPLY_EXIT"
          echo ""
          echo "=== 投递明细 ==="
          cat /tmp/apply_results.json 2>/dev/null || echo "(无结果)"

      - name: Upload apply results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apply-results
          path: |
            /tmp/search_result.json
            /tmp/scan_result.json
            /tmp/apply_results.json
          if-no-files-found: ignore
