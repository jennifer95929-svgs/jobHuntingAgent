name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 快速语法检查 — 跑在 GitHub 托管 Runner，始终可用
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compile all)
        run: python -m compileall -q .

      - name: Import smoke test
        env:
          OPENAI_API_KEY: sk-placeholder-for-ci-import-check
        run: python -c "import config; import resume.profile; import pipeline.llm; import pipeline.filter; import pipeline.matcher; import pipeline.research; import loop_agent_v2.llm; import loop_agent_v2.salary_decode; import loop_agent_v2.history; print('all imports OK')"

  # 完整冒烟测试 — 跑在本地自托管 Runner（可访问浏览器/登录态）
  smoke:
    runs-on: [self-hosted, macos, local]
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Browser + Agent compile check
        run: |
          python -m compileall -q browser agent.py loop_agent_v3
          echo "compile check passed"
