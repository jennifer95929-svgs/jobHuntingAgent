name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compile all)
        run: python -m compileall -q .

      - name: Import smoke test
        run: python -c "
          import config;
          import resume.profile;
          import pipeline.llm;
          import pipeline.filter;
          import pipeline.matcher;
          import pipeline.research;
          import loop_agent_v2.llm;
          import loop_agent_v2.salary_decode;
          import loop_agent_v2.history;
          print('all imports OK')
          "
